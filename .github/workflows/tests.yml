name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: python -m pip install --upgrade pip PyYAML
      - name: Verifier
        run: python outils/verifier.py

      - name: Verifier que les gardes sont protegees
        run: python outils/neutraliser.py
