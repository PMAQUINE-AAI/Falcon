[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon"
version = "1.0.0.dev0"
description = "Rejeu de traces SAP GUI sur un CSV"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["falcon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
