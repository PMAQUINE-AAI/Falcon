# Carte d'ecran de SE16N — LIVREE VIDE, ET C'EST VOULU.
#
# Les identifiants ci-dessous ne sont pas dans ce depot et ne sont pas dans la
# trace fournie. Les ecrire de memoire produirait un module qui a l'air
# complet et qui echoue au premier appel reel, avec une erreur que personne ne
# saurait rattacher a une conjecture faite six mois plus tot.
#
# Tant que des marqueurs « TODO » subsistent ici, `exporter_table` REFUSE de
# tourner et nomme ce qui manque.
#
# Pour la remplir, sur un poste Windows avec SAP GUI ouvert :
#
#     python -m falcon diagnostiquer            # sur l'ecran de selection
#     python -m falcon diagnostiquer            # apres execution, sur la liste
#
# La commande rend l'identite de l'ecran (transaction / programme / dynpro) et
# l'identifiant complet de chaque champ. Recopier ici.

