  programme: TODO
  dynpro: TODO

# Champ ou se saisit le nom de la table.
champ_table: TODO

# Bouton ou touche qui lance l'extraction.
bouton_executer: TODO

# Ecran de resultat, apres execution.
ecran_resultat:
  transaction: TODO
  programme: TODO
  dynpro: TODO

# Grille ALV portant les lignes extraites.
